packages:
  - apps/*
  - packages/*
  - infra

catalogMode: prefer

catalog:
  '@cloudflare/vite-plugin': ^1.64.0
  '@fontsource/courier-prime': ^5.3.0
  '@fontsource/libre-caslon-text': ^5.3.0
  '@shelf/auth': workspace:*
  '@shelf/catalogue': workspace:*
  '@shelf/db': workspace:*
  '@types/node': ^26.5.5
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.4
  hono: ^4.13.13
  htmx.org: 4.0.0
  open-props: ^1.7.23
  typescript: ^7.0.2
  valibot: ^1.5.0
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  wrangler: ^4.151.1
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
allowBuilds:
  esbuild: true
  protobufjs: false
  workerd: true
minimumReleaseAgeExclude:
  - '@voidzero-dev/vite-plus-core@1.4.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.4.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.4.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.4.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.4.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.4.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.4.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.4.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.4.0'
  - vite-plus@1.4.0
